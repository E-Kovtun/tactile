train_dataloader:
  batch_size: 1024
  num_workers: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 1024
  num_workers: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true
normalization:
  mean: null
  std: null
object_classes: null
object_class_weights: null
sensor: xela
dataset_list:
- type: teleop
  sequence_list:
  - corn
  - rubikscube
  - metalcup
  - cup
  - ball
  - drill
  - watermelon
  - mustard
  - lego
  - pringle
  - popcorn
  - loofah
  - legopool
  - slipper
  train_dataset_ids:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  val_dataset_ids:
  - 9
  dataset:
    _target_: tactile_ssl.data.xela_tactile_tdex.XelaBYOLDataset
    config:
      window_time: 0.1
      window_overlap: 0.0
      interpolating_freq: 100
      frame_stride: 10
      frame_offset: 5
      subtract_baseline: true
      smooth_data: false
      bias_noise_std: 0
      bias_range: 0
    data_path: ${paths.xela}/xela/pretraining/extracted
    baseline_signal_path: ${paths.xela}/xela/pretraining/extracted/baseline/xela/data.pkl
    xela_urdf_path: ${paths.xela}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
    load_images: false
