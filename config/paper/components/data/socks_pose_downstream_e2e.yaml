sensor: sock
dataset:
  _target_: tactile_ssl.data.sock.create_sock_pose_datasets
  root: ${paths.socks}
  mode: official_cnn
  stride: 5
  normalization_samples: 4096
  sensor_map_path: ${paths.sock_geometry}/sensor_map.csv
  edge_path: ${paths.sock_geometry}/edges.csv
normalization:
  mean: null
  std: null
train_dataloader:
  batch_size: 128
  num_workers: 4
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 128
  num_workers: 2
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true
test_dataloader:
  batch_size: 128
  num_workers: 2
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true
