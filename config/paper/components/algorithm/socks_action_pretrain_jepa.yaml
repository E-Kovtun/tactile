_target_: tactile_ssl.algorithm.XelaJEPAModule
encoder:
  _target_: tactile_ssl.model.sock_${model_size}
  in_dim: 453
  in_chans: 1
  sequence_length: 5
  time_chunk_size: 5
  temporal_patch_padding: auto
  num_register_tokens: 0
  pos_embed_fn: learned
  with_masktoken: false
  drop_path_rate: 0.3
  drop_path_uniform: true
  normalization: ${data.normalization}
  causal: false
num_context_masks: 1
num_target_masks: 4
context_mask_scale:
- 0.5
- 0.9
target_mask_scale:
- 0.1
- 0.18
masking: null
moving_average_decay:
- 0.994
- 1.0
use_momentum: true
optim_cfg:
  _partial_: true
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.05
lr_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
  steps_per_epoch: ???
  T_max: ???
  final_lr: 1.0e-06
  start_lr: 1.0e-05
  warmup_epochs: 30
wd_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.CosineWDSchedule
  final_weight_decay: 0.4
  ref_weight_decay: 0.04
  T_max: ???
