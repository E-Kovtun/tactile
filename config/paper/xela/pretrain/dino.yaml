# @package _global_
defaults:
- /common
- /components/model_info@model_info: xela_pretrain_jepa
- /components/data@data: xela_pretrain_dino
- /components/algorithm@algorithm: xela_pretrain_dino
- _self_
seed: 42
model_size: tiny
model_embed_dim: ${model_info.${model_size}.embed_dim}
trainer:
  max_epochs: 500
  grad_clip_norm: 10.0
  validation_frequency: 5
  checkpoint_frequency: 10
  log_frequency: 500
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
task_name: pretrain_dinov2_encoder
ssl_name: dinov2
ssl_model_size: tiny
experiment_name: xela/pretrain/dino
run_name: seed${seed}
pretrain_seed: ${seed}
