# @package _global_
defaults:
- /common
- /components/model_info@model_info: xela_pretrain_jepa
- /components/data@data: xela_pretrain_jepa
- /components/algorithm@algorithm: xela_pretrain_jepa
- _self_
seed: 42
model_size: tiny
model_embed_dim: ${model_info.${model_size}.embed_dim}
trainer:
  max_epochs: 500
  grad_clip_norm: 10.0
  validation_frequency: 5
  checkpoint_frequency: 10
  log_frequency: 500
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  devices: 4
  enable_progress_bar: true
  max_steps: null
task_name: pretrain_transformer_encoder
ssl_name: jepa_graph
ssl_model_size: tiny
experiment_name: xela/pretrain/jepa
run_name: seed${seed}
pretrain_seed: ${seed}
