# @package _global_
defaults:
- /common
- /components/model_info@model_info: xela_pretrain_jepa
- /components/data@data: xela_pretrain_byol
- /components/algorithm@algorithm: xela_pretrain_byol
- _self_
seed: 42
model_size: tiny
model_embed_dim: ${model_info.${model_size}.embed_dim}
trainer:
  max_epochs: 150
  grad_clip_norm: 10.0
  validation_frequency: 5
  checkpoint_frequency: 50
  log_frequency: 500
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  grad_accum_steps: 1
  devices: 1
  precision: bf16-mixed
  enable_progress_bar: true
task_name: pretrain_byol_encoder
ssl_name: byol
ssl_model_size: tiny
experiment_name: xela/pretrain/byol
run_name: seed${seed}
pretrain_seed: ${seed}
