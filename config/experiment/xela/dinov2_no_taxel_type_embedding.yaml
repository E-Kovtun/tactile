# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela
  - override /algorithm: xela_dinov2
  - _self_

model_size: tiny
ckpt_path: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/DiNO_without_taxel_type_embedding_or_spatial_coords_2026.07.20_10-56/checkpoints
task_name: pretrain_dinov2_encoder # pretrain_nopos_linear_encoder
ssl_name: dinov2
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: DiNO_without_taxel_type_embedding_or_spatial_coords

data:
  features:
    use_spatial_coords: false

trainer:
  max_epochs: 500
  validation_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.xela_${model_size}
    in_chans: 3
    use_taxel_type_embedding: false
