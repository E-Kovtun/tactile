# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela
  - override /algorithm: xela_dinov2
  - _self_

model_size: tiny
ckpt_path: ~

task_name: pretrain_spatial_gnn_encoder
ssl_name: dinov2
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: SumEmbeddings192

data:
  features:
    use_spatial_coords: true
  dataset_list:
    - type: teleop
      sequence_list:
        - corn
        - rubikscube
        - metalcup
        - cup
        - ball
        - drill
        - mustard
        - lego
        - pringle
        - legopool
        - watermelon
        - popcorn
        - loofah
        - slipper
      train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      val_dataset_ids: [9]
      dataset:
        _target_: tactile_ssl.data.xela_tactile.XelaGraphSSLDataset
        config:
          window_time: ${data.window_time}
          window_overlap: ${data.window_overlap}
          interpolating_freq: ${data.interpolating_freq}
          subtract_baseline: true
          smooth_data: false
          bias_noise_std: 0
          bias_range: 0
          cache: ${data.cache}
          preprocessing: ${data.preprocessing}
          features: ${data.features}
          graph:
            enabled: true
            type: physical
            topology_mode: static_edges
            edge_attr_mode: distance
            bridge_k: 4
        data_path: ${paths.data_root}/xela/pretraining/extracted
        baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
        xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
        load_images: false

trainer:
  max_epochs: 500
  validation_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.XelaSpatialGNNTransformer
    in_dim: 368
    in_chans: 6
    sequence_length: 10
    time_chunk_size: 10
    embed_dim: ${model_embed_dim}
    signal_embed_dim: 192
    spatial_embed_dim: 192
    spatial_gat_heads: 4
    graph_type: physical
    bridge_k: 4
    edge_mode: distance
    depth: ${model_info.${model_size}.depth}
    num_heads: 3
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: true
    drop_path_rate: 0.3
    drop_path_uniform: true
    normalization: ${data.normalization}
    causal: false
