# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

sensor: xela
ssl_name: byol
ssl_model_size: tiny
ckpt_path: null
resume_id: null
run_name: alexnet_temporal_conv_192
train_data_budget: 1.0
val_data_budget: 1.0

task:
  checkpoint_encoder: ???
  encoder_type: byol
  model_encoder:
    _target_: tactile_ssl.model.TemporalTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.XelaTactileRasterizer
    sequence_length: ${int_multiply:${data.dataset.config.window_time},${data.dataset.config.interpolating_freq}}
    time_chunk_size: ${task.model_encoder.sequence_length}
    embedding_dim: ${model_info.${ssl_model_size}.embed_dim}
    pretrained: false
    image_size: 224
    normalization: null
