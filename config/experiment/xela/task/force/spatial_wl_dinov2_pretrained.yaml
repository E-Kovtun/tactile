# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

sensor: xela
ssl_name: dinov2
ssl_model_size: tiny
checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_spatial_wl_encoder_dinov2/SpatialWL2Sum192_2026.07.17_15-28/checkpoints/epoch-0500.ckpt
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: ${train_data_budget}

experiment_name: downstream_force_spatial_wl_dinov2
run_name: pretrained_spatial_wl2_sum192

data:
  dataset:
    config:
      features:
        use_spatial_coords: true
      graph:
        enabled: true
        type: physical
        topology_mode: static_edges
        edge_attr_mode: topology
        window_frames: 10
        bridge_k: 4

task:
  checkpoint_encoder: ${checkpoint_encoder}
  model_encoder:
    _target_: tactile_ssl.model.XelaSpatialWLDINOTransformer
    in_dim: 368
    in_chans: 6
    sequence_length: 10
    time_chunk_size: 10
    embed_dim: ${model_info.${ssl_model_size}.embed_dim}
    spatial_embed_dim: ${model_info.${ssl_model_size}.embed_dim}
    spatial_wl_layers: 2
    bridge_k: 4
    depth: ${model_info.${ssl_model_size}.depth}
    num_heads: ${model_info.${ssl_model_size}.num_heads}
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: true
    drop_path_rate: 0.3
    drop_path_uniform: true
    normalization:
    causal: false
  model_task:
    embed_dim: ${ssl_model_size}
    pad_id: 15
