# @package _global_
defaults:
  - /jepa_pretrain: 2c_4t
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

sensor: xela
ssl_name: jepa
ckpt_path: ~
resume_id: ~
run_name: ${jepa_pretrain.run_name}

train_data_budget: 1.0
val_data_budget: ${train_data_budget} 

task:
  checkpoint_encoder: ${jepa_pretrain.checkpoint_encoder}

  model_task:
    pad_id: 15
