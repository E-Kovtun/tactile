# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

sensor: xela
ssl_name: dinov2
ckpt_path: ~
resume_id: ~

train_data_budget: 1.0
val_data_budget: ${train_data_budget}

experiment_name: downstream_force_dinov2_signal_pos_ref
run_name: eval_epoch_0032_${now:%Y.%m.%d}_${now:%H-%M}

data:
  dataset:
    config:
      features:
        use_spatial_coords: true

task:
  checkpoint_encoder: /workspace-SR004.nfs2/kovtun/tactile/experiments/pretrain_dinov2/2026.05.14-19-02/checkpoints/epoch-0500.ckpt
  checkpoint_task: /workspace-SR004.nfs2/kovtun/tactile/experiments/downstream_force_dinov2_signal_pos/train_budget_1_2026.05.27_12-05_2026.05.27_12-05/checkpoints/epoch-0032.pth

  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    pad_id: 15

  optim_cfg:
    _partial_: true
    _target_: torch.optim.Adam
    lr: 0.0

trainer:
  max_epochs: 1
  limit_train_batches: 1
  validation_frequency: 1
  sanity_validate: false
  save_checkpoint_dir: ${paths.output_dir}/checkpoints