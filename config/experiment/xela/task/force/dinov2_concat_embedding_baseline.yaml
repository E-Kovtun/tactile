# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

sensor: xela
ssl_name: dinov2
ckpt_path: ~
resume_id: ~

train_data_budget: 1.0
val_data_budget: ${train_data_budget}

baseline_embedding_dim: 64
experiment_name: downstream_force_dinov2
run_name: concat_embedding_baseline_dim_${baseline_embedding_dim}_${oc.env:TACTILE_RUN_TIMESTAMP}

data:
  dataset:
    config:
      features:
        use_spatial_coords: true

task:
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    _target_: tactile_ssl.downstream_task.XelaForceConcatEmbeddingBaselineProbe
    baseline_embedding_dim: ${baseline_embedding_dim}
    pad_id: 15
