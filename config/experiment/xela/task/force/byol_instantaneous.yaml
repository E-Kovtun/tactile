# @package _global_
defaults:
  - /experiment/xela/task/force/byol
  - _self_

# Frozen paper-like BYOL trunk: select the same zero-based midpoint frame (5)
# from every 10-frame downstream window.  A trainable 9216 -> 192 adapter is
# part of the probe, not the frozen encoder.
task:
  model_encoder:
    _target_: tactile_ssl.model.InstantaneousTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.XelaTactileRasterizer
    sequence_length: ${int_multiply:${data.dataset.config.window_time},${data.dataset.config.interpolating_freq}}
    frame_index: 5
    pretrained: false
    image_size: 224
  model_task:
    _target_: tactile_ssl.downstream_task.ProjectedXelaForceLinearProbe
    input_embed_dim: 9216
    time_chunk_size: ${task.model_encoder.time_chunk_size}
    embed_dim: tiny
    num_heads: 12
    depth: 1
    with_last_activations: true
    only_normal_force: false
    pad_id: null

