# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_force
  - override /task: xela_force_estimation
  - _self_

ssl_name: mae
sensor: xela
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

test:
  data:
    dataset_name: ['val/spherical_pad15', 'val/flat_pad15']
    # dataset_name: ['train2/increment_force_1_5N']

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/mae_xela_tiny.ckpt
  model_encoder:
    in_chans: 3
    sequence_length: ${int_multiply:${data.dataset.config.window_time},${data.dataset.config.interpolating_freq}}
    time_chunk_size: ${task.model_encoder.sequence_length}
    num_register_tokens: 1
    with_masktoken: True

  # model_task:
  #   only_normal_force: True
  #   pad_id: 15
