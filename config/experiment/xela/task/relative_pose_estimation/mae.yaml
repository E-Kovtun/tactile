# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_relative_pose
  - override /task: xela_relative_pose
  - _self_

ssl_name: mae
sensor: xela
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/mae_xela_tiny.ckpt
  model_encoder:
    in_chans: 3
    sequence_length: ${int_multiply:${data.dataset.config.window_time},${data.dataset.config.interpolating_freq}}
    time_chunk_size: ${task.model_encoder.sequence_length}
    num_register_tokens: 1
    with_masktoken: True
