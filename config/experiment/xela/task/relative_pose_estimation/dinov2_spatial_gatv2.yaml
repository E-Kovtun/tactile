# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_relative_pose
  - override /task: xela_relative_pose
  - _self_

ssl_name: dinov2
sensor: xela
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

spatial_hidden_dims: [32, 64]
spatial_gat_heads: 4
spatial_gat_dropout: 0.0
spatial_bridge_k: 4

experiment_name: downstream_pose_dinov2
run_name: spatial_gatv2_layers_${join:_,${spatial_hidden_dims}}

data:
  dataset:
    config:
      features:
        use_spatial_coords: true
      graph:
        enabled: true
        type: physical
        topology_mode: static_edges
        edge_attr_mode: distance
        window_frames: 10
        bridge_k: ${spatial_bridge_k}

task:
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    _target_: tactile_ssl.downstream_task.xela_relativepose.XelaRelativePoseSpatialGATv2Decoder
    spatial_hidden_dims: ${spatial_hidden_dims}
    spatial_gat_heads: ${spatial_gat_heads}
    spatial_gat_dropout: ${spatial_gat_dropout}
    bridge_k: ${spatial_bridge_k}
    edge_mode: distance
