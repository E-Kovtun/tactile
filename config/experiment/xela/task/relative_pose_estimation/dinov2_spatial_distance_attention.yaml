# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_relative_pose
  - override /task: xela_relative_pose
  - _self_

ssl_name: dinov2
sensor: xela
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

spatial_attention_layers: 1
spatial_attention_heads: 6
spatial_distance_hidden_dim: 16
spatial_distance_bias: true
experiment_name: downstream_pose_dinov2
run_name: spatial_distance_attention_l${spatial_attention_layers}_h${spatial_attention_heads}_${oc.env:TACTILE_RUN_TIMESTAMP}

data:
  dataset:
    config:
      features:
        use_spatial_coords: true

task:
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    _target_: tactile_ssl.downstream_task.xela_relativepose.XelaRelativePoseSpatialAttentionDecoder
    spatial_attention_layers: ${spatial_attention_layers}
    spatial_attention_heads: ${spatial_attention_heads}
    spatial_distance_hidden_dim: ${spatial_distance_hidden_dim}
    spatial_distance_bias: ${spatial_distance_bias}
