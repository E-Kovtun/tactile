# @package _global_
defaults:
  - /experiment/xela/task/relative_pose_estimation/byol
  - _self_

task:
  model_encoder:
    _target_: tactile_ssl.model.InstantaneousTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.XelaTactileRasterizer
    sequence_length: 10
    frame_index: 5
    pretrained: false
    image_size: 224
  model_task:
    _target_: tactile_ssl.downstream_task.xela_relativepose.ProjectedXelaRelativePoseDecoder
    input_embed_dim: 9216
    discretize: ${data.dataset.config.discretize}
    embed_dim: tiny
    num_heads: 6
    depth: 1

