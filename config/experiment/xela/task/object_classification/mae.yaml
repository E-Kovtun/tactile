# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_object
  - override /task: xela_object_classification
  - _self_

sensor: xela
ssl_name: mae
ckpt_path: ~
resume_id: ~

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/mae_xela_tiny.ckpt
  model_encoder:
    in_chans: 3
    sequence_length: ${int_multiply:${data.window_time},${data.interpolating_freq}}
    time_chunk_size: ${task.model_encoder.sequence_length}
    num_register_tokens: 1
    with_masktoken: True
