# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_object
  - override /task: xela_object_classification
  - _self_

sensor: xela
ssl_name: dinov2
ckpt_path: ~
resume_id: ~

experiment_name: downstream_object_classication_dinov2
run_name: Original

data:
  dataset_list:
    - type: teleop
      sequence_list:
        - corn
        - rubikscube
        - metalcup
        - cup
        - ball
        - drill
        - mustard
        - lego
        - pringle
        - legopool
        - watermelon
        - popcorn
        - loofah
        - slipper
      train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7]
      val_dataset_ids: [8]
      test_dataset_ids: [9]

      dataset:
        _target_: tactile_ssl.data.xela_tactile.XelaSSLDataset
        config:
          window_time: ${data.window_time}
          window_overlap: ${data.window_overlap}
          interpolating_freq: ${data.interpolating_freq}
          subtract_baseline: True
          smooth_data: False
          bias_noise_std: 0
          bias_range: 0
          cache: ${data.cache}
          features:
            use_spatial_coords: true
        data_path: ${paths.data_root}/xela/pretraining/extracted
        baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
        xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
        load_images: False

task:
  # checkpoint_encoder: /workspace-SR004.nfs2/kovtun/tactile/experiments/pretrain_dinov2/2026.05.14-19-02/checkpoints/epoch-0500.ckpt
  # checkpoint_encoder: /workspace-SR004.nfs2/kovtun/tactile/experiments/pretrain_nopos_dinov2/2026.05.25_18-32/checkpoints/epoch-0500.ckpt
  # checkpoint_encoder: /workspace-SR004.nfs2/kovtun/tactile/experiments/pretrain_nopos_linear_encoder_dinov2/2026.05.27_17-41/checkpoints/epoch-0500.ckpt
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: True
  
