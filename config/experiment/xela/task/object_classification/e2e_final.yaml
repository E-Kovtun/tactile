# @package _global_
defaults:
  - /experiment/xela/task/object_classification/jepa_probe_attn2_mlp
  - _self_

ssl_name: e2e
run_name: xela-e2e-object

trainer:
  devices: 1
  max_epochs: 500
  save_probe_weights_only: false
  early_stopping_enabled: true
  early_stopping_patience: 10
  early_stopping_delta: 0.00001
  early_stopping_checkpoint_name: best
  validation_frequency: 1
  sanity_validate: true

data:
  train_dataloader:
    batch_size: 64
  val_dataloader:
    batch_size: 64
  test_dataloader:
    batch_size: 64

task:
  checkpoint_encoder: null
  train_encoder: true
  encoder_normalization_float32: true
  model_encoder:
    normalization:
      mean: [-9.90929889678955, 4.820801734924316, -76.11141967773438]
      std: [93.05754089355469, 100.04659271240234, 108.84810638427734]
  optim_cfg:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1.0e-4
    weight_decay: 0.05
  scheduler_cfg:
    _partial_: true
    _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
    final_lr: 1.0e-6
    start_lr: 1.0e-5
    warmup_epochs: 30
