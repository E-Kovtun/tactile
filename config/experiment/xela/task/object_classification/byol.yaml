# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_object
  - override /task: xela_object_classification
  - _self_

sensor: xela
ssl_name: byol
ssl_model_size: tiny
ckpt_path: null
resume_id: null
run_name: alexnet_temporal_conv_192

task:
  checkpoint_encoder: ???
  encoder_type: byol
  model_encoder:
    _target_: tactile_ssl.model.TemporalTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.XelaTactileRasterizer
    sequence_length: ${int_multiply:${data.window_time},${data.interpolating_freq}}
    time_chunk_size: ${task.model_encoder.sequence_length}
    embedding_dim: ${model_info.${ssl_model_size}.embed_dim}
    pretrained: false
    image_size: 224
    normalization: ${data.normalization}
