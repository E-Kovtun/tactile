# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_object
  - override /task: xela_object_classification
  - _self_

sensor: xela
ssl_name: dinov2
ckpt_path: ~
resume_id: ~

baseline_embedding_dim: 64
experiment_name: downstream_object_classification_dinov2
run_name: concat_embedding_baseline_dim_${baseline_embedding_dim}_${oc.env:TACTILE_RUN_TIMESTAMP}

data:
  dataset_list:
    - type: teleop
      sequence_list:
        - corn
        - rubikscube
        - metalcup
        - cup
        - ball
        - drill
        - mustard
        - lego
        - pringle
        - legopool
        - watermelon
        - popcorn
        - loofah
        - slipper
      train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7]
      val_dataset_ids: [8]
      test_dataset_ids: [9]

      dataset:
        _target_: tactile_ssl.data.xela_tactile.XelaSSLDataset
        config:
          window_time: ${data.window_time}
          window_overlap: ${data.window_overlap}
          interpolating_freq: ${data.interpolating_freq}
          subtract_baseline: true
          smooth_data: false
          bias_noise_std: 0
          bias_range: 0
          cache: ${data.cache}
          features:
            use_spatial_coords: true
        data_path: ${paths.data_root}/xela/pretraining/extracted
        baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
        xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
        load_images: false

task:
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    _target_: tactile_ssl.downstream_task.xela_object.XelaObjectConcatEmbeddingBaselineClassifier
    baseline_embedding_dim: ${baseline_embedding_dim}
