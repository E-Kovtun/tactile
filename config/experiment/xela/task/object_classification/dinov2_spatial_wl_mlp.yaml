# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela_object
  - override /task: xela_object_classification
  - _self_

sensor: xela
ssl_name: dinov2
ckpt_path: ~
resume_id: ~

spatial_hidden_dims: [32, 64]
spatial_wl_layers: 2
spatial_bridge_k: 4
run_name: spatial_wl${spatial_wl_layers}_mlp_layers_${join:_,${spatial_hidden_dims}}

data:
  dataset_list:
    - type: teleop
      sequence_list:
        - corn
        - rubikscube
        - metalcup
        - cup
        - ball
        - drill
        - mustard
        - lego
        - pringle
        - legopool
        - watermelon
        - popcorn
        - loofah
        - slipper
      train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7]
      val_dataset_ids: [8]
      test_dataset_ids: [9]

      dataset:
        _target_: tactile_ssl.data.xela_tactile.XelaGraphSSLDataset
        config:
          window_time: ${data.window_time}
          window_overlap: ${data.window_overlap}
          interpolating_freq: ${data.interpolating_freq}
          subtract_baseline: true
          smooth_data: false
          bias_noise_std: 0
          bias_range: 0
          cache: ${data.cache}
          features:
            use_spatial_coords: true
          graph:
            enabled: true
            type: physical
            topology_mode: static_edges
            edge_attr_mode: topology
            bridge_k: ${spatial_bridge_k}
        data_path: ${paths.data_root}/xela/pretraining/extracted
        baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
        xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
        load_images: false

task:
  checkpoint_encoder: /workspace-SR004.nfs2/konovalov/tactile/experiments/pretrain_dinov2_encoder_dinov2/2026.07.14_22-31/checkpoints/epoch-0500.ckpt
  model_encoder:
    in_chans: 6
    num_register_tokens: 1
    with_masktoken: true

  model_task:
    _target_: tactile_ssl.downstream_task.xela_object.XelaObjectSpatialWLMLPClassifier
    spatial_hidden_dims: ${spatial_hidden_dims}
    spatial_wl_layers: ${spatial_wl_layers}
    bridge_k: ${spatial_bridge_k}
