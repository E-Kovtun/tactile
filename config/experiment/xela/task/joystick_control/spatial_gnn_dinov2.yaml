# @package _global_
defaults:
  - /paths: ~
  - /wandb: ~
  - /data: xela_joystick_control
  - /task: xela_joystick_control
  - _self_

ssl_name: dinov2
sensor: xela
ssl_model_size: tiny
checkpoint_encoder: ~
ckpt_path: ~
resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

data:
  dataset:
    config:
      cache:
        enabled: true
        root: ${paths.work_dir}/.cache/xela_artifacts
        force_recompute: false
        log_hits: true
      features:
        use_spatial_coords: true
      graph:
        enabled: true
        type: physical
        topology_mode: static_edges
        edge_attr_mode: distance
        window_frames: 10
        bridge_k: 4

task:
  checkpoint_encoder: ${checkpoint_encoder}
  model_encoder:
    _target_: tactile_ssl.model.XelaSpatialGNNTransformer
    in_dim: 368
    in_chans: 6
    sequence_length: 10
    time_chunk_size: 10
    embed_dim: ${model_info.${ssl_model_size}.embed_dim}
    signal_embed_dim: 192
    spatial_embed_dim: 192
    spatial_gat_heads: 4
    graph_type: physical
    bridge_k: 4
    edge_mode: distance
    depth: ${model_info.${ssl_model_size}.depth}
    num_heads: 3
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: true
    drop_path_rate: 0.3
    drop_path_uniform: true
    normalization:
    causal: false
  model_task:
    embed_dim: ${ssl_model_size}
    num_heads: 3
