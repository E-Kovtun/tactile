# @package _global_
defaults:
  - /experiment/xela/jepa_graph
  - _self_

run_name: physical_dijkstra_1c4t_2local2stratifiedrandom_c50-90_t10-18

algorithm:
  num_context_masks: 1
  num_target_masks: 4
  context_mask_scale: [0.50, 0.90]
  target_mask_scale: [0.10, 0.18]
  masking:
    target:
      groups:
        - count: 2
          strategy: connected_region
          growth: dijkstra
        - count: 2
          strategy: stratified_random
          min_per_group: 1
          remainder_allocation: proportional
