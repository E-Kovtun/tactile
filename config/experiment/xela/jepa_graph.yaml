# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela
  - override /algorithm: xela_jepa_graph
  - _self_

model_size: tiny
ckpt_path: ~

task_name: pretrain_transformer_encoder
ssl_name: jepa_graph
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: physical_dijkstra_1c2t_c50-80_t10-22

algorithm:
  num_context_masks: 1
  num_target_masks: 2
  context_mask_scale: [0.50, 0.80]
  target_mask_scale: [0.10, 0.22]

data:
  dataset_target: tactile_ssl.data.xela_tactile.XelaGraphSSLDataset
  graph_mask_collator:
    _target_: tactile_ssl.utils.jepa_masking.JEPAGraphMaskCollator
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    num_context_masks: ${algorithm.num_context_masks}
    num_target_masks: ${algorithm.num_target_masks}
    masking: ${algorithm.masking}
  train_dataloader:
    collate_fn: ${data.graph_mask_collator}
  val_dataloader:
    collate_fn: ${data.graph_mask_collator}
  graph:
    enabled: true
    type: physical
    topology_mode: per_window
    edge_attr_mode: distance
    params:
      bridge_k: 4

trainer:
  max_epochs: 500
  validation_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
