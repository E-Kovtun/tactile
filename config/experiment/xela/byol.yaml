# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: byol
  - override /algorithm: xela_byol
  - _self_

model_size: tiny
ckpt_path: ~

task_name: pretrain_byol_encoder
ssl_name: byol
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: byol

trainer:
  max_epochs: 500
  validation_frequency: 5
  checkpoint_frequency: 20
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
