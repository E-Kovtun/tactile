# @package _global_
defaults:
  - override /paths: default
  - override /tensorboard: tensorboard_config
  - override /data: xela
  - override /algorithm: xela_mae
  - _self_

model_size: tiny
ckpt_path: ~

task_name: pretrain_transformer_encoder
ssl_name: mae
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: MAE_on_fixed_dataset

trainer:
  max_epochs: 500
  validation_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints

algorithm:
  encoder:
    _target_: tactile_ssl.model.xela_${model_size}
