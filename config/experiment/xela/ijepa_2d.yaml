# @package _global_
defaults:
  - /experiment/xela/jepa_graph
  - _self_

ssl_name: ijepa_2d
run_name: ijepa_2d_1c4t_c50-90_t10-18

algorithm:
  num_context_masks: 1
  num_target_masks: 4
  context_mask_scale: [0.50, 0.90]
  target_mask_scale: [0.10, 0.18]
  encoder:
    pos_embed_fn: xela_2d_sincos
    use_taxel_type_embedding: false

data:
  dataset_target: tactile_ssl.data.xela_tactile.XelaSSLDataset
  graph:
    enabled: false
  ijepa_2d_mask_collator:
    _target_: tactile_ssl.utils.xela_ijepa_masking.XelaIJEPA2DMaskCollator
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    num_context_masks: ${algorithm.num_context_masks}
    num_target_masks: ${algorithm.num_target_masks}
    aspect_ratio: [0.75, 1.50]
    min_context_keep_tokens: 32
    min_context_keep_ratio: 0.15
    max_resample_attempts: 64
  train_dataloader:
    collate_fn: ${data.ijepa_2d_mask_collator}
  val_dataloader:
    collate_fn: ${data.ijepa_2d_mask_collator}

trainer:
  max_epochs: 500
  validation_frequency: 5
