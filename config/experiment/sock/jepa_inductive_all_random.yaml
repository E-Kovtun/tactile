# @package _global_
defaults:
  - /experiment/sock/jepa_graph
  - _self_

run_name: inductive_global_4random_150k

data:
  dataset:
    classification_recording_split: train
    classification_split_seed: ${seed}
    classification_val_recording_ratio: 0.15
    classification_test_recording_ratio: 0.15
    pose_splits: [train]
  graph_mask_collator:
    target_specs:
      - {strategy: random}
      - {strategy: random}
      - {strategy: random}
      - {strategy: random}

trainer:
  # 55,195 samples / (64 * 4 GPUs) = 215 optimizer steps per epoch.
  # 698 epochs schedule 150,070 steps; max_steps stops exactly at 150,000.
  max_epochs: 698
  max_steps: 150000
  validation_frequency: 5
  log_frequency: 1

algorithm:
  lr_scheduler_cfg:
    warmup_epochs: 42  # 9,030 warmup steps, close to the original 8,910.
