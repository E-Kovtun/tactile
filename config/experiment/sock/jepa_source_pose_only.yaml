# @package _global_
defaults:
  - /experiment/sock/jepa_inductive_all_random
  - _self_

run_name: source_pose_only_4random_150k

data:
  dataset:
    include_classification: false
    pose_splits: [train]
    source_normalization: true
    sampling_temperature: null
    pose_normalization_mean: 0.0804904026450019
    pose_normalization_std: 0.22589546589653367

trainer:
  # 47,190 samples -> 184 optimizer steps/epoch on 4 GPUs at batch 64/GPU.
  max_epochs: 816
  max_steps: 150000

algorithm:
  lr_scheduler_cfg:
    warmup_epochs: 49  # 9,016 optimizer steps.
