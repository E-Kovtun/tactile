# @package _global_
defaults:
  - override /paths: sock
  - override /tensorboard: tensorboard_config
  - override /data: sock
  - override /algorithm: sock_jepa_graph
  - _self_

model_size: tiny
ckpt_path: null
task_name: pretrain_sock_encoder
ssl_name: jepa_graph
experiment_name: ${task_name}_${ssl_name}
run_name: 1c4t_2feet_local_random

data:
  graph_mask_collator:
    _target_: tactile_ssl.utils.sock_jepa_masking.SockJEPAGraphMaskCollator
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    min_context_keep_tokens: 32
    min_context_keep_ratio: 0.15
    growth: dijkstra
    target_specs:
      - {foot: 0, strategy: connected_region}
      - {foot: 0, strategy: random}
      - {foot: 1, strategy: connected_region}
      - {foot: 1, strategy: random}
  train_dataloader:
    collate_fn: ${data.graph_mask_collator}
  val_dataloader:
    collate_fn: ${data.graph_mask_collator}

trainer:
  max_epochs: 500
  validation_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
