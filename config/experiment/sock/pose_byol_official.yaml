# @package _global_
defaults:
  - override /paths: sock
  - override /data: sock_pose
  - override /task: sock_pose_jepa_official
  - _self_

ssl_name: byol
ssl_model_size: tiny
run_name: alexnet_temporal_conv_192_seed${seed}

data:
  dataset:
    mode: jepa_official

task:
  checkpoint_encoder: ???
  encoder_type: byol
  model_encoder:
    _target_: tactile_ssl.model.TemporalTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.SockTactileRasterizer
      sensor_map_path: ${paths.work_dir}/notebooks/assets/context_visualization/sock_physical_sensor_map.csv
    sequence_length: 5
    time_chunk_size: 5
    embedding_dim: ${model_info.${ssl_model_size}.embed_dim}
    pretrained: false
    image_size: 224
