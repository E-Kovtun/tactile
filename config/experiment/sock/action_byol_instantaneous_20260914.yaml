# @package _global_
defaults:
  - override /paths: sock
  - override /data: sock_action
  - override /task: sock_action_classification
  - _self_

ssl_name: byol
ssl_model_size: tiny
run_name: alexnet_instantaneous_9216_seed${seed}

task:
  checkpoint_encoder: ???
  encoder_type: byol
  model_encoder:
    _target_: tactile_ssl.model.InstantaneousTactileAlexNet
    rasterizer:
      _target_: tactile_ssl.model.SockTactileRasterizer
      sensor_map_path: ${paths.work_dir}/notebooks/assets/context_visualization/sock_physical_sensor_map.csv
    sequence_length: 5
    frame_index: 2
    pretrained: false
    image_size: 224
  model_task:
    _target_: tactile_ssl.downstream_task.sock_byol_instantaneous_20260914.ProjectedSockTemporalClassifier
    encoder_embed_dim: 9216
