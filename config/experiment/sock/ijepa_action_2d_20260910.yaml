# @package _global_
defaults:
  - /experiment/sock/jepa_source_action_only_2l2r_footbound
  - _self_
ssl_name: ijepa_2d
algorithm:
  encoder:
    _target_: tactile_ssl.model.sensor_ijepa_20260910.sock_ijepa_tiny
    sensor_map_path: ${data.dataset.root}/sock_physical_sensor_map.csv
    pos_embed_fn: sensor_2d_sincos
data:
  ijepa_2d_mask_collator:
    _target_: tactile_ssl.utils.sensor_ijepa_20260910.SensorIJEPA2DMaskCollator
    sensor: sock
    sensor_map_path: ${data.dataset.root}/sock_physical_sensor_map.csv
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    num_context_masks: 1
    num_target_masks: 4
    aspect_ratio: [0.75, 1.50]
    min_context_keep_tokens: 32
    min_context_keep_ratio: 0.15
    max_resample_attempts: 64
  train_dataloader:
    collate_fn: ${data.ijepa_2d_mask_collator}
  val_dataloader:
    collate_fn: ${data.ijepa_2d_mask_collator}
