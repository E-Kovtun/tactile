# @package _global_
defaults:
  - override /paths: deco
  - override /tensorboard: tensorboard_config
  - override /data: deco_task4_cached
  - override /algorithm: deco_byol_instantaneous
  - _self_

model_size: tiny
ckpt_path: null
task_name: pretrain_deco_task4_encoder
ssl_name: byol
experiment_name: ${task_name}_${ssl_name}
seed: 42
run_name: alexnet_instantaneous_midpoint

data:
  dataset:
    stride: 3
    include_graph: false
  train_dataloader:
    batch_size: 8192
    shuffle: true
    drop_last: true
  val_dataloader:
    batch_size: 8192
    shuffle: false
    drop_last: false

trainer:
  max_epochs: 150
  grad_accum_steps: 1
  validation_frequency: 5
  checkpoint_frequency: 5
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
