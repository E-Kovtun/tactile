# @package _global_
defaults:
  - override /paths: deco
  - override /tensorboard: tensorboard_config
  - override /data: deco_task4_cached
  - override /algorithm: deco_mae
  - _self_
model_size: tiny
ckpt_path: null
task_name: pretrain_deco_task4_encoder
ssl_name: mae
experiment_name: ${task_name}_${ssl_name}
seed: 42
run_name: visible_random75
trainer:
  max_epochs: 150
  max_steps: null
  grad_accum_steps: 1
  validation_frequency: 5
  checkpoint_frequency: 50
  save_checkpoint_dir: ${paths.output_dir}/checkpoints

data:
  train_dataloader:
    batch_size: 2048
  val_dataloader:
    batch_size: 512

algorithm:
  lr_scheduler_cfg:
    warmup_epochs: 9
