# @package _global_
defaults:
  - /experiment/deco/jepa_graph
  - override /data: deco_task4
  - _self_

run_name: direct_4local_handbound_matched150
data:
  dataset:
    include_graph: true
  graph_mask_collator:
    target_specs:
      - {hand: 0, strategy: connected_region}
      - {hand: 0, strategy: connected_region}
      - {hand: 1, strategy: connected_region}
      - {hand: 1, strategy: connected_region}
  train_dataloader:
    batch_size: 512
    shuffle: false
  val_dataloader:
    batch_size: 512
trainer:
  max_epochs: 150
algorithm:
  lr_scheduler_cfg:
    warmup_epochs: 5
