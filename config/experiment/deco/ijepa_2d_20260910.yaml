# @package _global_
defaults:
  - /experiment/deco/jepa_graph
  - override /data: deco_task4
  - _self_

ssl_name: ijepa_2d
run_name: deco_ijepa_2d_matched150
algorithm:
  encoder:
    _target_: tactile_ssl.model.sensor_ijepa_20260910.deco_ijepa_tiny
    pos_embed_fn: sensor_2d_sincos
  lr_scheduler_cfg:
    warmup_epochs: 5
data:
  dataset:
    include_graph: false
  ijepa_2d_mask_collator:
    _target_: tactile_ssl.utils.sensor_ijepa_20260910.SensorIJEPA2DMaskCollator
    sensor: deco
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    num_context_masks: 1
    num_target_masks: 4
    aspect_ratio: [0.75, 1.50]
    min_context_keep_tokens: 32
    min_context_keep_ratio: 0.15
    max_resample_attempts: 64
  train_dataloader:
    batch_size: 512
    shuffle: false
    collate_fn: ${data.ijepa_2d_mask_collator}
  val_dataloader:
    batch_size: 512
    collate_fn: ${data.ijepa_2d_mask_collator}
trainer:
  max_epochs: 150
