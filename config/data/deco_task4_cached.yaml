sensor: deco

dataset:
  _target_: tactile_ssl.data.deco_ssl_cache.create_cached_deco_ssl_datasets
  cache_root: ${paths.deco_root}/tactile-ssl-cache-v1
  cache_manifest_path: ${paths.deco_root}/tactile-ssl-cache-v1/manifest.json
  # Kept explicit so existing launchers can assert the cached data contract.
  split_seed: 42
  window_size: 3
  stride: 3
  include_graph: false

train_dataloader:
  # Match the current DECO DINO run; only the sample order changes.
  batch_size: 32
  num_workers: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true
