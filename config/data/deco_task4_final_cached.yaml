sensor: deco

dataset:
  _target_: tactile_ssl.data.deco_policy_cache_final.create_final_cached_deco_policy_datasets
  cache_root: ${paths.deco_root}/policy-cache-sparsh-r18-images16-v1
  cache_manifest_path: ${paths.deco_root}/policy-cache-sparsh-r18-images16-v1/manifest.json
  vision_cache_root: ${paths.deco_root}/policy-cache-resnet18-imagenet1k-v1-gap-fp16
  vision_cache_manifest_path: ${paths.deco_root}/policy-cache-resnet18-imagenet1k-v1-gap-fp16/manifest.json
  max_open_shards: 2
  validation_max_samples: 8192

train_dataloader:
  batch_size: 1024
  num_workers: 4
  shuffle: false
  drop_last: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 1024
  num_workers: 4
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true
