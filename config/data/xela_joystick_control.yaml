train_data_budget: 1.0
val_data_budget: 1.0

sensor: xela

cache:
  enabled: true
  root: ${paths.work_dir}/.cache/xela_artifacts
  force_recompute: false
  log_hits: true
  num_workers: 0

dataset:
  _target_: tactile_ssl.data.xela_joystick_control.XelaJoystickDataset.create_from_files
  config:
    discretize:
      ~ # Remove the key to disable discretization or set to None
      # upper_bound: 1.0
      # lower_bound: -1.0
      # num_bins: 16
    window_time: 10.0
    output_normalize: True
    with_sensor_pose: True
    train_data_budget: 1.0
    cache: ${data.cache}
  data_root: ${paths.data_root}/xela_data/downstream_tasks/joystick_control/
  # xela_urdf_path: ${paths.data_root}/joystick_control_hiss_dataset/urdf/ahrcpcpn.urdf
  file_paths: joystick_control_hiss_dataset_x100e10_xela_sensorpose.h5

train_dataloader:
  batch_size: 16
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: True

val_dataloader:
  batch_size: 16
  num_workers: 1
  drop_last: True
  pin_memory: True
  persistent_workers: True
  shuffle: False
