train_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

normalization:
  mean: null # This will be populated in train.py during data loading and stored in model state_dict
  std: null # This will be populated in train.py during data loading and stored in model state_dict
object_classes: null
object_class_weights: null

sensor: xela
dataset_list:
  - type: teleop
    sequence_list:
      - corn
      - rubikscube
      - metalcup
      - cup
      - ball
      - drill
      - watermelon
      - mustard
      - lego
      - pringle
      - popcorn
      - loofah
      - legopool
      - slipper
    train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    val_dataset_ids: [9]

    dataset:
      _target_: tactile_ssl.data.xela_tactile_tdex.XelaBYOLDataset
      config:
        window_time: 0.1
        window_overlap: 0.0
        interpolating_freq: 100
        # One 10 Hz sample: use the middle (zero-based index 5) of every
        # non-overlapping ten-frame block on the 100 Hz grid.
        frame_stride: 10
        frame_offset: 5
        subtract_baseline: True
        smooth_data: False
        bias_noise_std: 0
        bias_range: 0
      data_path: ${paths.data_root}/xela/pretraining/extracted
      baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
      xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
      load_images: False
