train_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

normalization:
  mean: null # This will be populated in train.py during data loading and stored in model state_dict
  std: null # This will be populated in train.py during data loading and stored in model state_dict
object_classes: null
object_class_weights: null

cache:
  enabled: true
  root: ${paths.work_dir}/.cache/xela_artifacts
  force_recompute: false
  fingerprint_mode: stats
  log_hits: true

preprocessing:
  outlier_min: 20000
  outlier_max: 60000
  timestamp_policy: overlap_minmax_v1
  baseline_policy: mean_over_all_baseline_frames_v1

features:
  use_spatial_coords: false

window_time: 0.1 # 0.01
window_overlap: 0.0
interpolating_freq: 100

sensor: xela
dataset_list:
  - type: teleop
    sequence_list:
      - corn
      - rubikscube
      - metalcup
      - cup
      - ball
      - drill
      - mustard
      - lego
      - pringle
      - legopool
      - watermelon
      - popcorn
      - loofah
      - slipper
    train_dataset_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    val_dataset_ids: [9]

    dataset:
      _target_: tactile_ssl.data.xela_tactile.XelaSSLDataset
      config:
        window_time: ${data.window_time}
        window_overlap: ${data.window_overlap}
        interpolating_freq: ${data.interpolating_freq}
        subtract_baseline: True
        smooth_data: False
        bias_noise_std: 0
        bias_range: 0
        cache: ${data.cache}
        preprocessing: ${data.preprocessing}
        features: ${data.features}
      data_path: ${paths.data_root}/xela/pretraining/extracted
      baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
      xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
      load_images: False
