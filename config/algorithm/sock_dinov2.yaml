_target_: tactile_ssl.algorithm.XelaDINOv2Module

encoder:
  _target_: tactile_ssl.model.sock_${model_size}
  in_dim: 453
  in_chans: 1
  sequence_length: 5
  time_chunk_size: 5
  num_register_tokens: 1
  pos_embed_fn: learned
  with_masktoken: true
  drop_path_rate: 0.3
  drop_path_uniform: true
  normalization: ${data.normalization}
  causal: false

dino_head:
  _partial_: true
  _target_: tactile_ssl.model.layers.DINOHead
  out_dim: 65536

num_global_masks: 2
num_local_masks: 8
min_keep_num_sensors: 1
global_mask_scale: [0.4, 1.0]
local_mask_scale: [0.1, 0.4]
moving_average_decay: [0.994, 1.0]
allow_mask_overlap: true
teacher_temp: [0.04, 0.07]
teacher_warmup_epochs: 10

optim_cfg:
  _partial_: true
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 0.05

lr_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
  steps_per_epoch: ???
  T_max: ???
  final_lr: 1.0e-6
  start_lr: 1.0e-5
  warmup_epochs: 30

wd_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.CosineWDSchedule
  final_weight_decay: 0.4
  ref_weight_decay: 0.04
  T_max: ???

# Labels are deliberately unavailable during pretraining.
online_probes: []
online_probes_lrs: []
reconstruction_log_freq: 20
