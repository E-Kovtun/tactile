defaults:
  - xela_jepa
  - _self_

masking:
  mode: multiblock_graph
  context:
    strategy: connected_region
    growth: dijkstra
  target:
    strategy: connected_region
    growth: dijkstra
  overlap:
    target_target: allow
    context_target: subtract_from_context
    context_context: allow
  min_context_keep_tokens: 32
  min_context_keep_ratio: 0.15
  max_resample_attempts: 32
