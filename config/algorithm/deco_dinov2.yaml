_target_: tactile_ssl.algorithm.XelaDINOv2Module

encoder:
  _target_: tactile_ssl.model.deco_${model_size}
  in_dim: 528
  in_chans: 5
  sequence_length: 3
  time_chunk_size: 3
  # The only DECO tokenizer used for this DINO matrix: a direct linear map
  # from each 4T/5T hypertaxel history to one 192-D token.
  tokenizer_mode: direct
  tokenizer_hidden_dim: ${model_embed_dim}
  num_register_tokens: 1
  pos_embed_fn: learned
  with_masktoken: true
  drop_path_rate: 0.3
  drop_path_uniform: true
  causal: false

dino_head:
  _partial_: true
  _target_: tactile_ssl.model.layers.DINOHead
  out_dim: 65536
  # Keep the weight-normalization scale fixed, as in the reference DINO head.
  # If trainable, AdamW drives it toward zero over the long DECO schedule.
  norm_last_layer: true

num_global_masks: 2
num_local_masks: 8
min_keep_num_sensors: 1
global_mask_scale: [0.4, 1.0]
local_mask_scale: [0.1, 0.4]
ibot_mask_ratio: [0.1, 0.5]
allow_mask_overlap: true
moving_average_decay: [0.994, 1.0]
teacher_temp: [0.04, 0.07]
# DECO has about 5.6x more optimizer steps per epoch than the reference Xela
# run. Two epochs keep the temperature warmup close to Xela's 5.8k steps.
teacher_warmup_epochs: 2
freeze_last_layer_epochs: 1
centering: centering

optim_cfg:
  _partial_: true
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 0.05

lr_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
  steps_per_epoch: ???
  T_max: ???
  final_lr: 1.0e-6
  start_lr: 1.0e-5
  # Five DECO epochs are about 16.3k steps, close to Xela's 17.5k-step warmup.
  warmup_epochs: 5

wd_scheduler_cfg:
  _partial_: true
  _target_: tactile_ssl.model.custom_scheduler.CosineWDSchedule
  final_weight_decay: 0.4
  ref_weight_decay: 0.04
  T_max: ???

online_probes: []
online_probes_lrs: []
reconstruction_log_freq: 1000
legacy_teacher_crop_reversal: false
