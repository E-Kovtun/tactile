_target_: tactile_ssl.algorithm.XelaJEPAModule
encoder:
  _target_: tactile_ssl.model.xela_${model_size}
  in_dim: 368 # total number of xela sensors in hand
  in_chans: 3 # 6 # 3 xela mag channels + 3 position channels
  sequence_length: 10
  time_chunk_size: 10
  temporal_patch_padding: auto
  num_register_tokens: 0
  pos_embed_fn: learned
  with_masktoken: False
  drop_path_rate: 0.3
  drop_path_uniform: True
  normalization: ${data.normalization}
  causal: False

# currently the best version
# num_context_masks: 1
# num_target_masks: 4
# context_mask_scale: [0.50, 0.9]
# target_mask_scale: [0.10, 0.18]

num_context_masks: 2
num_target_masks: 4
context_mask_scale: [0.40, 0.65]
target_mask_scale: [0.05, 0.11]

moving_average_decay: [0.994, 1.0]
use_momentum: True

optim_cfg:
  _partial_: True
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 0.05

lr_scheduler_cfg:
  _partial_: True
  _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
  steps_per_epoch: ???
  T_max: ???
  final_lr: 1.0e-6
  start_lr: 1e-5
  warmup_epochs: 30

wd_scheduler_cfg:
  _partial_: True
  _target_: tactile_ssl.model.custom_scheduler.CosineWDSchedule
  final_weight_decay: 0.4
  ref_weight_decay: 0.04
  T_max: ???
