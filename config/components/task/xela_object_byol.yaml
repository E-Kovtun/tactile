_target_: tactile_ssl.downstream_task.XelaObjectSLModule
checkpoint_task: null
model_encoder:
  _target_: tactile_ssl.model.InstantaneousTactileAlexNet
  in_dim: 368
  in_chans: 3
  sequence_length: ${int_multiply:${data.window_time},${data.interpolating_freq}}
  time_chunk_size: ${task.model_encoder.sequence_length}
  num_register_tokens: 0
  pos_embed_fn: learned
  with_masktoken: false
  drop_path_rate: 0.3
  drop_path_uniform: true
  normalization: ${data.normalization}
  causal: false
  rasterizer:
    _target_: tactile_ssl.model.XelaTactileRasterizer
  embedding_dim: ${model_info.${ssl_model_size}.embed_dim}
  pretrained: false
  image_size: 224
  frame_index: 5
model_task:
  _target_: tactile_ssl.probe.ProjectedLinearClassifier
  input_embed_dim: 9216
  classes: ${data.object_classes}
  class_weights: ${data.object_class_weights}
  projection_dim: 192
checkpoint_encoder: ${checkpoint}
train_encoder: false
encoder_type: byol
optim_cfg:
  _partial_: true
  _target_: torch.optim.AdamW
  lr: 0.0001
  weight_decay: 0.05
scheduler_cfg: null
