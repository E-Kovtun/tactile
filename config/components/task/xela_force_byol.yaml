  num_heads: 12
  depth: 1
  with_last_activations: true
  only_normal_force: false
  pad_id: null
  input_embed_dim: 9216
checkpoint_encoder: ${checkpoint}
train_encoder: false
encoder_type: byol
optim_cfg:
  _partial_: true
