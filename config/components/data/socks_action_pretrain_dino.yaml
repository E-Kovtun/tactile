sensor: sock
dataset:
  _target_: tactile_ssl.data.sock.create_sock_pretrain_datasets
  root: ${paths.socks}
  window_size: 5
  stride: 5
  include_classification: true
  pose_splits: []
  validation_samples: 512
  normalization_samples: 4096
  classification_recording_split: all
  classification_window_split: train
  source_normalization: true
  sampling_temperature: null
  action_normalization_mean: 559.1628505277317
  action_normalization_std: 88.54081723165012
  sensor_map_path: ${paths.sock_geometry}/sensor_map.csv
  edge_path: ${paths.sock_geometry}/edges.csv
normalization:
  mean: null
  std: null
train_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true
