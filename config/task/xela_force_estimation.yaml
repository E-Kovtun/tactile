#@package _global_

task_name: downstream_force
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

run_name: transformer_${now:%Y.%m.%d}_${now:%H-%M}

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/${experiment_name}/${run_name}_${hydra.job.id}

trainer:
  # Reference Xela downstream runs use one GPU. Keeping this explicit avoids
  # changing the global batch size when several GPUs are visible to Fabric.
  devices: 1
  max_epochs: 51
  validation_frequency: 1 
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: "log"
  max_task_checkpoints: 10
  save_probe_weights_only: True

  early_stopping_enabled: true
  early_stopping_patience: 10
  early_stopping_delta: 0.00001


task:
  _target_: tactile_ssl.downstream_task.XelaForceSLModule
  checkpoint_task: ~

  # model_encoder:
  #   _target_: tactile_ssl.model.xela_${ssl_model_size}
  #   in_dim: 368
  #   in_chans: 3 # 6
  #   sequence_length: 10
  #   time_chunk_size: 10
  #   pos_embed_fn: learned
  #   num_register_tokens: 1
  #   with_masktoken: True
  #   drop_path_rate: 0.3
  #   drop_path_uniform: True
  #   causal: False
  #   normalization:

  # model_encoder:
  #   _target_: tactile_ssl.model.XelaGAT
  #   in_dim: 368 # total number of xela sensors in hand
  #   in_chans: 6 # 3 xela mag channels + 3 position channels
  #   embed_dim: 192
  #   sequence_length: 10
  #   time_chunk_size: 10
  #   pos_embed_fn: learned
  #   num_register_tokens: 1
  #   with_masktoken: True
  #   normalization: 

  model_encoder:
    _target_: tactile_ssl.model.xela_${ssl_model_size}
    in_dim: 368 
    in_chans: 3 
    sequence_length: 10
    time_chunk_size: 10
    num_register_tokens: 0
    pos_embed_fn: learned
    with_masktoken: False
    drop_path_rate: 0.3
    drop_path_uniform: True
    normalization: 
    causal: False

  model_task:
    _target_: tactile_ssl.downstream_task.XelaForceLinearProbe
    time_chunk_size: ${task.model_encoder.time_chunk_size}
    embed_dim: ${ssl_model_size}
    num_heads: 12
    depth: 1
    with_last_activations: True
    only_normal_force: False
    pad_id: ~

  checkpoint_encoder: ${checkpoint_encoder}
  train_encoder: false
  encoder_type: ${ssl_name}

  optim_cfg:
    _partial_: True
    _target_: torch.optim.Adam
    lr: 0.0001

  scheduler_cfg: ~
