#@package _global_

task_name: downstream_pose_estimation_comparison
ssl_model_size: tiny
experiment_name: ${task_name}_${ssl_name}
seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/${experiment_name}/${hydra.job.id}

run_name:  transformer_${now:%Y.%m.%d}_${now:%H-%M}

trainer:
  # Reference Xela downstream runs use one GPU.
  devices: 1
  max_epochs: 25
  validation_frequency: 1
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: "log"
  max_task_checkpoints: 10
  save_probe_weights_only: True

  early_stopping_enabled: true
  early_stopping_patience: 10
  early_stopping_delta: 0.00001


data:
  dataset:
    config:
      train_data_budget: ${train_data_budget}
      val_data_budget: ${val_data_budget}

