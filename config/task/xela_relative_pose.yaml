  # model_encoder:
  #   _target_: tactile_ssl.model.XelaLinear
  #   in_dim: 368 # total number of xela sensors in hand
  #   in_chans: 3 # 6 # 3 xela mag channels + 3 position channels
  #   sequence_length: 10
  #   time_chunk_size: 10
  #   pos_embed_fn: learned
  #   num_register_tokens: 1
  #   with_masktoken: True
  #   normalization: ${data.normalization}

  model_encoder:
    _target_: tactile_ssl.model.xela_${ssl_model_size}
    in_dim: 368 
    in_chans: 3 
    sequence_length: 10
    time_chunk_size: 10
    num_register_tokens: 0
    pos_embed_fn: learned
    with_masktoken: False
    drop_path_rate: 0.3
    drop_path_uniform: True
    normalization: 
    causal: False

  model_task:
    _target_: tactile_ssl.downstream_task.xela_relativepose.XelaRelativePoseDecoder
    discretize: ${data.dataset.config.discretize}
    embed_dim: ${ssl_model_size}
    num_heads: 6
    depth: 1

  checkpoint_encoder: ${checkpoint_encoder}
  train_encoder: false
  encoder_type: ${ssl_name}

  optim_cfg:
    _partial_: True
    _target_: torch.optim.Adam
    lr: 0.0001

  scheduler_cfg: ~
