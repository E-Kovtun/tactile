defaults:
  - default
  - _self_

# Override either root when the runs are mounted elsewhere.
experiment_root: ${oc.env:TACTILE_EXPERIMENT_ROOT,/workspace-SR004.nfs2/konovalov/tactile/experiments}
output_dir: ${experiment_root}/significance/purple_only_signal_with_jepa

tasks:
  force:
    comparison_blocks:
      - id: downstream_spatial_encoders
        name: Downstream spatial encoders — baseline Random (64)
        baseline:
          id: random_64
          name: Random baseline (64)
          report_variant: only_signal
          directory: ${experiment_root}/downstream_force_dinov2/concat_embedding_baseline_dim_64_2026.07.16_16-45_2026.07.16_16-45
        experiments:
          - id: mlp_32_64
            name: MLP (32->64)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_dinov2/spatial_mlp_layers_32_64_2026.07.16_10-03_2026.07.16_10-03
          - id: wl2_mlp_32_64
            name: WL (2) + MLP (32->64)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_dinov2/spatial_wl2_mlp_layers_32_64_2026.07.16_13-14
          - id: gnn_32_64
            name: GNN (32->64)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_dinov2/spatial_gatv2_layers_32_64_2026.07.16_14-58
      - id: spatial_pretraining
        name: Spatial pretraining — baseline Original
        baseline:
          id: original
          name: Original
          report_variant: only_signal
          directory: ${experiment_root}/downstream_force_dinov2/Original_2026.07.16_09-11
        experiments:
          - id: pretrain_wl2
            name: Pretrain WL (2)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_spatial_wl_dinov2/pretrained_spatial_wl2_sum192_2026.07.20_09-14
      - id: jepa_masking
        name: JEPA masking — baseline JEPA transformer (old)
        baseline:
          id: jepa_transformer_old
          name: JEPA transformer (old)
          report_variant: only_signal
          directory: ${experiment_root}/downstream_force_jepa/jepa_transformer_old_*
          select: latest
        experiments:
          - id: jepa_1c_4t
            name: JEPA transformer (1, 4)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_1c_4t_*
            select: latest
          - id: jepa_2c_4t
            name: JEPA (2, 4) — epoch 500
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_2c_4t_epoch500_*
            select: latest
          - id: graph_jepa_2c4t_c40_65_t05_11
            name: Graph JEPA Dijkstra (2c, 4t; c40-65%, t5-11%)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_2c4t_c40-65_t05-11_*
            select: latest
          - id: graph_jepa_1c4t_c40_65_t05_11
            name: Graph JEPA Dijkstra (1c, 4t; c40-65%, t5-11%)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_1c4t_c40-65_t05-11_*
            select: latest
          - id: graph_jepa_1c2t_c50_80_t10_22
            name: Graph JEPA Dijkstra (1c, 2t; c50-80%, t10-22%)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_1c2t_c50-80_t10-22_*
            select: latest
          - id: graph_jepa_1c4t_c50_90_t10_18
            name: Graph JEPA Dijkstra (1c, 4t; c50-90%, t10-18%)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_1c4t_c50-90_t10-18_*
            select: latest
          - id: jepa_contiguous_1c_2t
            name: JEPA contiguous (1, 2)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_contiguous_1c_2t_*
            select: latest
          - id: jepa_mix_2c_4t
            name: JEPA (2, 4) — mix random/contiguous
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_mix_2c_4t_*
            select: latest
          - id: jepa_random_1c_2t
            name: JEPA random (1, 2)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_random_1c_2t_*
            select: latest
          - id: jepa_context_contiguous_target_contiguous_new
            name: JEPA context contiguous → target contiguous (new)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_context_contiguous_target_contiguous_new_*
            select: latest
          - id: jepa_context_contiguous_target_random_new
            name: JEPA context contiguous → target random (new)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/jepa_context_contiguous_target_random_new_*
            select: latest
          - id: jepa_context_random_target_contiguous_new
