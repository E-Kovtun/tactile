defaults:
  - default
  - _self_

experiment_root: /workspace-SR004.nfs2/konovalov/tactile/experiments
output_dir: ${experiment_root}/significance/graph_jepa_1c4t_vs_2c4t

tasks:
  force:
    comparison_blocks:
      - id: graph_jepa_context_count
        name: Graph JEPA physical Dijkstra — context count
        baseline:
          id: graph_jepa_2c_4t
          name: Graph JEPA physical Dijkstra (2, 4)
          report_variant: only_signal
          directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_2c_4t_*
          select: latest
        experiments:
          - id: graph_jepa_1c_4t
            name: Graph JEPA physical Dijkstra (1, 4)
            report_variant: only_signal
            directory: ${experiment_root}/downstream_force_jepa/graph_physical_dijkstra_1c_4t_*
