paths:
  data_root: ${oc.env:XELA_DATA_ROOT}
  log_dir: ${hydra:runtime.output_dir}
  tensorboard_dir: ${hydra:runtime.output_dir}/tensorboard
  encoder_checkpoint_root: ${oc.env:XELA_REPRO_OUTPUT_ROOT}
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
tensorboard:
  log_dir: ${hydra:runtime.output_dir}/tensorboard
data:
  train_dataloader:
    batch_size: 256
    num_workers: 8
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: true
    collate_fn: ${data.graph_mask_collator}
  val_dataloader:
    batch_size: 64
    num_workers: 8
    shuffle: true
    drop_last: true
    pin_memory: true
    persistent_workers: true
    collate_fn: ${data.graph_mask_collator}
  normalization:
    mean: null
    std: null
  object_classes: null
  object_class_weights: null
  cache:
    enabled: true
    root: ${oc.env:XELA_REPRO_CACHE_ROOT}
    force_recompute: false
    fingerprint_mode: stats
    log_hits: true
    num_workers: 4
  preprocessing:
    outlier_min: 20000
    outlier_max: 60000
    timestamp_policy: overlap_minmax_v1
    baseline_policy: mean_over_all_baseline_frames_v1
    numeric_policy: legacy_float64_v1
  features:
    use_spatial_coords: false
  dataset_target: tactile_ssl.data.xela_tactile.XelaGraphSSLDataset
  graph:
    enabled: true
    type: physical
    topology_mode: per_window
    edge_attr_mode: distance
    params:
      bridge_k: 4
  window_time: 0.1
  window_overlap: 0.0
  interpolating_freq: 100
  sensor: xela
  dataset_list:
  - type: teleop
    sequence_list:
    - corn
    - rubikscube
    - metalcup
    - cup
    - ball
    - drill
    - mustard
    - lego
    - pringle
    - legopool
    - watermelon
    - popcorn
    - loofah
    - slipper
    train_dataset_ids:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    val_dataset_ids:
    - 9
    dataset:
      _target_: ${data.dataset_target}
      config:
        window_time: ${data.window_time}
        window_overlap: ${data.window_overlap}
        interpolating_freq: ${data.interpolating_freq}
        subtract_baseline: true
        smooth_data: false
        bias_noise_std: 0
        bias_range: 0
        cache: ${data.cache}
        preprocessing: ${data.preprocessing}
        features: ${data.features}
        graph: ${data.graph}
      data_path: ${paths.data_root}/xela/pretraining/extracted
      baseline_signal_path: ${paths.data_root}/xela/pretraining/extracted/baseline/xela/data.pkl
      xela_urdf_path: ${paths.data_root}/xela/pretraining/extracted/urdf/ahrcpcpn.urdf
      load_images: false
  graph_mask_collator:
    _target_: tactile_ssl.utils.jepa_masking.JEPAGraphMaskCollator
    context_mask_scale: ${algorithm.context_mask_scale}
    target_mask_scale: ${algorithm.target_mask_scale}
    num_context_masks: ${algorithm.num_context_masks}
    num_target_masks: ${algorithm.num_target_masks}
    masking: ${algorithm.masking}
algorithm:
  _target_: tactile_ssl.algorithm.deco_teacher_20260923.DecoTeacherModeJEPAModule
  encoder:
    _target_: tactile_ssl.model.xela_${model_size}
    in_dim: 368
    in_chans: 3
    sequence_length: 10
    time_chunk_size: 10
    temporal_patch_padding: auto
    num_register_tokens: 0
    pos_embed_fn: learned
    with_masktoken: false
    drop_path_rate: 0.3
    drop_path_uniform: true
    normalization: ${data.normalization}
    causal: false
  num_context_masks: 1
  num_target_masks: 4
  context_mask_scale:
  - 0.5
  - 0.9
  target_mask_scale:
  - 0.15
  - 0.2
  moving_average_decay:
  - 0.994
  - 1.0
  use_momentum: true
  optim_cfg:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 0.0001
    weight_decay: 0.05
  lr_scheduler_cfg:
    _partial_: true
    _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
    steps_per_epoch: ???
    T_max: ???
    final_lr: 1.0e-06
    start_lr: 1.0e-05
    warmup_epochs: 30
  wd_scheduler_cfg:
    _partial_: true
    _target_: tactile_ssl.model.custom_scheduler.CosineWDSchedule
    final_weight_decay: 0.1
    ref_weight_decay: 0.04
    T_max: ???
  masking:
    mode: multiblock_graph
    context:
      strategy: random
      growth: dijkstra
      random_crop: true
    target:
      strategy: connected_region
      growth: dijkstra
      groups:
      - count: 2
        strategy: connected_region
        scale:
        - 0.15
        - 0.2
        growth: dijkstra
        max_pairwise_overlap_ratio: 0.2
        max_previous_overlap_ratio: 0.2
      - count: 1
        strategy: stratified_random
        scale:
        - 0.05
        - 0.09
        min_per_group: 1
        remainder_allocation: proportional
        max_pairwise_overlap_ratio: 0.2
        max_previous_overlap_ratio: 0.2
      - count: 1
        strategy: stratified_random
        scale:
        - 0.15
        - 0.2
        min_per_group: 1
        remainder_allocation: proportional
        max_pairwise_overlap_ratio: 0.2
        max_previous_overlap_ratio: 0.2
    overlap:
      target_target: allow
      context_target: subtract_from_context
      context_context: allow
    min_context_keep_tokens: 32
    min_context_keep_ratio: 0.15
    max_resample_attempts: 128
    overlap_relative_to_smaller: true
    constrained_random_sampling: true
  deterministic_teacher: true
  prediction_loss: mse
model_info:
  tiny:
    embed_dim: 192
    depth: 12
    num_heads: 3
    mlp_ratio: 4
  small:
    embed_dim: 384
    depth: 12
    num_heads: 3
    mlp_ratio: 4
  base:
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4
  large:
    embed_dim: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4
seed: 3407
model_size: tiny
model_embed_dim: ${model_info.${model_size}.embed_dim}
resume_id: null
ckpt_path: null
experiment_name: ${task_name}_${ssl_name}
run_name: xmg-a4-p3407
trainer:
  max_epochs: 500
  grad_clip_norm: 10.0
  validation_frequency: 5
  checkpoint_frequency: 50
  log_frequency: 500
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  devices: 1
  max_steps: null
  enable_progress_bar: true
task_name: pretrain_transformer_encoder
ssl_name: jepa_graph
ssl_model_size: tiny
